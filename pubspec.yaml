name: aurora
description: "Aurora: tarefas, hábitos, treino, finanças e metas num app só."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.13.5

dependencies:
  convert: ^3.1.2
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  xml: ^7.1.0

flutter:
  uses-material-design: true
  assets:
    # Catálogo de alimentos: TACO 4ª ed., NEPA/Unicamp (gerado por tool/taco/converter.dart).
    - assets/taco.json
    # Biblioteca de exercícios (gerada por tool/exercicios/converter.ps1; animações no Storage).
    - assets/exercicios.json
    # Ícone do app (gerado por tool/icone/gerar.ps1 a partir de tool/icone/aurora.svg).
    - assets/icone/aurora.png
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
