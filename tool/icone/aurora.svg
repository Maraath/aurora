<svg xmlns="http://www.w3.org/2000/svg" viewBox="{{VIEWBOX}}">
  <!-- Ícone do Aurora: cortinas de aurora (verde embaixo, rosa e violeta em cima)
       atrás de um pico como o Kirkjufell. O céu e o chão passam das bordas
       (-40 a 140) para o ícone adaptável do Android, que recorta em volta. -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1240"/>
      <stop offset="0.6" stop-color="#0C0A24"/>
      <stop offset="1" stop-color="#060512"/>
    </linearGradient>
    <linearGradient id="rv" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5CF0B0"/>
      <stop offset="0.3" stop-color="#5CF0B0" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#E77BFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9D8CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rr" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7DF5A8"/>
      <stop offset="0.25" stop-color="#FF6FB5" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#E77BFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9D8CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5CF0B0"/>
      <stop offset="0.5" stop-color="#42E3C8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9D8CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="monte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1830"/>
      <stop offset="1" stop-color="#05040C"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5CF0B0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5CF0B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect x="-40" y="-40" width="180" height="180" fill="url(#ceu)"/>

  <g fill="#F2EEFF">
    <circle cx="12" cy="10" r="0.8"/><circle cx="30" cy="8" r="0.7"/><circle cx="46" cy="12" r="0.9"/>
    <circle cx="86" cy="8" r="0.8"/><circle cx="70" cy="24" r="0.6"/><circle cx="20" cy="30" r="0.6"/>
    <circle cx="94" cy="28" r="0.5"/><circle cx="4" cy="22" r="0.5"/>
  </g>

  <ellipse cx="50" cy="66" rx="48" ry="10" fill="url(#brilho)" opacity="0.7"/>

  <g filter="url(#suave)">
    <rect x="6" y="18" width="7" height="58" fill="url(#rl)"/>
    <rect x="15" y="12" width="5" height="62" fill="url(#rl)" opacity="0.8"/>
    <rect x="22" y="20" width="8" height="52" fill="url(#rl)"/>
    <rect x="34" y="14" width="6" height="56" fill="url(#rv)" opacity="0.6"/>
    <rect x="56" y="8" width="6" height="64" fill="url(#rv)"/>
    <rect x="63" y="4" width="8" height="70" fill="url(#rr)"/>
    <rect x="73" y="10" width="5" height="62" fill="url(#rr)" opacity="0.85"/>
    <rect x="80" y="14" width="8" height="58" fill="url(#rv)"/>
    <rect x="90" y="20" width="6" height="50" fill="url(#rr)" opacity="0.7"/>
  </g>

  <path d="M-40 84 L10 80 C24 74 32 60 40 42 L45 33 L49 36 C54 46 60 58 72 68 C80 74 90 76 100 78 L140 82 L140 140 L-40 140 Z"
        fill="url(#monte)"/>
  <path d="M-40 94 L140 90 L140 140 L-40 140 Z" fill="#04030A"/>
</svg>
