<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Trocado pelo --base-href do `flutter build web` (precisa começar e terminar com "/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Aurora: tarefas, hábitos, treino, finanças e metas num app só.">
  <!-- viewport-fit=cover: o céu vai até a borda; o conteúdo fica dentro do safe-area (ver #app no CSS).
       maximum-scale=1 + inputs com 16px: o Safari não dá zoom ao tocar num campo. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080716">
  <meta name="color-scheme" content="dark light">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS: "Adicionar à Tela de Início" abre sem a barra do Safari, como app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- black-translucent: a barra de status fica por cima do céu (o app desce o conteúdo pelo safe-area). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aurora">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Aurora</title>

  <style>
    :root {
      --ceu: #080716;
      --texto: #EEF0FB;
      --apagado: #A3A6C8;
      --grad-ini: #3EDB9A;
      --grad-fim: #7E7BFF;
      /* Safe-area do iPhone (notch, Dynamic Island, indicador de início). */
      --sa-cima: env(safe-area-inset-top, 0px);
      --sa-baixo: env(safe-area-inset-bottom, 0px);
      --sa-esq: env(safe-area-inset-left, 0px);
      --sa-dir: env(safe-area-inset-right, 0px);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--ceu);
      color: var(--texto);
      /* Sensação de app: sem seleção de texto, sem menu de toque longo, sem "puxar para atualizar". */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Campos de texto (o Flutter cria <input>/<textarea> escondidos para o teclado):
       16px ou mais evita o zoom automático do Safari ao focar. Seleção volta a valer neles. */
    input, textarea, select, [contenteditable] {
      font-size: 16px !important;
      -webkit-user-select: text;
      user-select: text;
    }

    /* O Flutter ocupa a página inteira (o céu vai atrás da barra de status, como num app
       instalado). O safe-area vai para o Flutter por auroraAreaSegura()
       (lib/core/area_segura.dart), e cada tela desvia com SafeArea. */
    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    /* Mede o safe-area (env direto, sem var). A caixa cresce com o padding, então o
       ResizeObserver percebe quando o iOS informa ou muda os valores. */
    #medida-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }

    /* Tela de carregamento: aparece na hora (antes do Flutter) e some no 1º quadro. */
    #abertura {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: var(--sa-cima) var(--sa-dir) var(--sa-baixo) var(--sa-esq);
      background:
        radial-gradient(120% 60% at 50% -10%, rgba(62, 219, 154, .16), transparent 60%),
        radial-gradient(90% 50% at 85% 0%, rgba(126, 123, 255, .14), transparent 60%),
        var(--ceu);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #abertura.saindo { opacity: 0; pointer-events: none; }
    #abertura img {
      width: 96px;
      height: 96px;
      border-radius: 22%;
      box-shadow: 0 10px 40px rgba(126, 123, 255, .25);
    }
    #abertura .nome { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
    #abertura .barra {
      width: 120px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
    }
    #abertura .barra::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--grad-ini), var(--grad-fim));
      animation: correr 1.1s ease-in-out infinite;
    }
    #abertura .aviso {
      min-height: 20px;
      max-width: 280px;
      text-align: center;
      font-size: 14px;
      line-height: 20px;
      color: var(--apagado);
    }
    @keyframes correr {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #abertura .barra::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="abertura" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="nome">Aurora</div>
    <div class="barra"></div>
    <div class="aviso" id="abertura-aviso"></div>
  </div>
  <div id="app"></div>
  <div id="medida-area"></div>
  <!-- Em arquivo, não embutido: a Content-Security-Policy (web/_headers) barra script embutido. -->
  <script src="aurora_web.js"></script>

  <!-- Carrega o Flutter dentro de #app e registra o Service Worker (web/flutter_bootstrap.js). -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
